services:
  researchos:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RESEARCH_DATA_DIR: /data
      RESEARCH_ALLOW_LIVE: "false"
    volumes:
      - research-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  research-data:
