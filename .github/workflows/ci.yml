name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.24'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --extra mcp --frozen
      - run: make lint test demo eval
      - uses: actions/upload-artifact@v4
        with:
          name: offline-research-${{ matrix.python }}
          path: |
            artifacts/demo/*.md
            artifacts/demo/*.html
            artifacts/demo/*.json
            eval/results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t researchos:ci .
      - run: |
          docker run -d --name researchos-ci -p 8000:8000 researchos:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs researchos-ci
          exit 1
