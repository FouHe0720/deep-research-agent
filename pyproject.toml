[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "researchos"
version = "0.1.0"
description = "Evidence-first bounded research, with reproducible offline fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29",
  "pydantic-settings>=2.6,<3", "beautifulsoup4>=4.12,<5", "markdown-it-py>=3,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1", "respx>=0.22,<0.23"]
browser = ["playwright>=1.50,<2"]
[project.scripts]
researchos = "researchos.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/researchos"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
